server:
  port: 8083
spring:
  application:
    name: auth-center
  datasource:
    url: jdbc:mysql://172.16.75.105:3306/auth_center_db?useSSL=false&serverTimezone=Asia/Hong_Kong&allowPublicKeyRetrieval=true
    username: root
    password: abcd@123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 50
      min-idle: 50
      max-active: 300
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      database: 0
      host: 172.16.75.105
      port: 6379
      password: abcd@123456
